  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.12);
    z-index: 1;
  }

  /* Boy hitzone - approximate center-bottom area where the boy sleeps */
  #boy-zone {
    position: fixed;
    z-index: 5;
    /* approx position of the sleeping boy in the image */
    left: 30%;
    top: 35%;
    width: 40%;
    height: 38%;
    /* debug: border: 2px dashed red; */
    pointer-events: none;
  }

  #hud {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 20px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent);
  }

  .hud-box {
    background: rgba(255,220,50,0.92);
    border: 3px solid #c8860a;
    border-radius: 12px;
    padding: 6px 18px;
    font-family: 'Bangers', cursive;
    font-size: 1.5rem;
    color: #5a2d00;
    letter-spacing: 1px;
    box-shadow: 0 3px 0 #c8860a;
  }

  #timer-box { background: rgba(255,100,100,0.92); border-color: #a00; color: #fff; box-shadow: 0 3px 0 #a00; }

  .mosquito {
    position: fixed;
    z-index: 20;
    cursor: none;
    animation: mozzie-float 0.35s ease-in-out infinite alternate;
    filter: drop-shadow(0 0 5px rgba(180,0,0,0.5));
    line-height: 1;
  }

  @keyframes mozzie-float {
    from { transform: translateY(0px) rotate(-6deg) scaleX(1); }
    to   { transform: translateY(-5px) rotate(6deg) scaleX(-1); }
  }

  .splat {
    position: fixed;
    z-index: 30;
    font-size: 2.5rem;
    pointer-events: none;
    animation: splat-anim 0.65s ease-out forwards;
    transform-origin: center;
  }

  @keyframes splat-anim {
    0%   { transform: scale(0.4) rotate(-20deg); opacity: 1; }
    40%  { transform: scale(1.7) rotate(15deg); opacity: 1; }
    100% { transform: scale(1.0) rotate(-5deg); opacity: 0; }
  }

  .score-popup {
    position: fixed;
    z-index: 40;
    font-family: 'Bangers', cursive;
    font-size: 1.9rem;
    color: #ffe033;
    text-shadow: -2px -2px 0 #c00, 2px 2px 0 #c00;
    pointer-events: none;
    animation: popup-anim 0.85s ease-out forwards;
    white-space: nowrap;
  }

  @keyframes popup-anim {
    0%   { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-65px) scale(1.3); opacity: 0; }
  }

  .bite-popup {
    position: fixed;
    z-index: 41;
    font-family: 'Bangers', cursive;
    font-size: 2rem;
    color: #ff3333;
    text-shadow: -2px -2px 0 #000, 2px 2px 0 #000;
    pointer-events: none;
    animation: popup-anim 1.2s ease-out forwards;
    white-space: nowrap;
  }

  #start-screen, #end-screen {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.78);
    gap: 18px;
  }

  #end-screen { display: none; }

  .screen-title {
    font-family: 'Bangers', cursive;
    font-size: 4rem;
    color: #ffe033;
    text-shadow: 4px 4px 0 #c00, -2px -2px 0 #c00;
    letter-spacing: 3px;
    text-align: center;
    line-height: 1.1;
  }

  .screen-sub {
    font-size: 1.25rem;
    color: #fff;
    text-align: center;
    max-width: 400px;
    line-height: 1.6;
  }

  .btn {
    font-family: 'Bangers', cursive;
    font-size: 1.8rem;
    letter-spacing: 2px;
    background: #ffe033;
    color: #5a2d00;
    border: 4px solid #c8860a;
    border-radius: 16px;
    padding: 12px 40px;
    cursor: none;
    box-shadow: 0 6px 0 #c8860a;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 9px 0 #c8860a; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #c8860a; }

  #final-score {
    font-family: 'Bangers', cursive;
    font-size: 3rem;
    color: #ffe033;
    text-shadow: 2px 2px 0 #c00;
  }

  /* red flash on boy bite */
  #bite-flash {
    position: fixed;
    inset: 0;
    z-index: 90;
    background: rgba(255,0,0,0);
    pointer-events: none;
    transition: background 0.05s;
  }
  #bite-flash.flash {
    background: rgba(255,0,0,0.28);
  }
</style>
</head>
<body>

<div id="bg"></div>
<div id="overlay"></div>
<div id="bite-flash"></div>
<div id="boy-zone"></div>
<div id="custom-cursor">🎾</div>

<div id="hud">
  <div class="hud-box">🦟 SCORE: <span id="score-val">0</span></div>
  <div class="hud-box">❤️ <span id="lives-display">♥♥♥</span></div>
  <div class="hud-box timer-box" id="timer-box">⏱ <span id="timer-val">30</span>s</div>
</div>

<div id="start-screen">
  <div class="screen-title">🦟 MOSQUITO<br>MASSACRE!</div>
  <div class="screen-sub">ছেলেটা ঘুমাচ্ছে...<br>মশা এসে কামড়াতে চাইছে! 😱<br><br>মশা বয়ের গায়ে লাগার আগেই মারো! 🎾</div>
  <button class="btn" onclick="startGame()">▶ শুরু করো!</button>
</div>

<div id="end-screen">
  <div class="screen-title">⏰ শেষ!</div>
  <div id="end-msg" class="screen-sub"></div>
  <div id="final-score"></div>
  <button class="btn" onclick="startGame()">🔄 আবার খেলো</button>
</div>

<script>
// ── Custom Cursor ─────────────────────────────────────────
const cursor = document.getElementById('custom-cursor');
// Alternate between bat and hand
let cursorMode = 'bat'; // 'bat' | 'hand'
const CURSORS = { bat: '🎾', hand: '✋' };
// Toggle with right-click
document.addEventListener('contextmenu', e => {
  e.preventDefault();
  cursorMode = cursorMode === 'bat' ? 'hand' : 'bat';
  cursor.textContent = CURSORS[cursorMode];
});

document.addEventListener('mousemove', e => {
  cursor.style.left = e.clientX + 'px';
  cursor.style.top  = e.clientY + 'px';
});
document.addEventListener('mousedown', () => cursor.classList.add('slap'));
document.addEventListener('mouseup',   () => cursor.classList.remove('slap'));

// ── Audio Engine ──────────────────────────────────────────
const AC = new (window.AudioContext || window.webkitAudioContext)();

function playMozzieHum(freq) {
  // Continuous mosquito hum oscillator: buzzy sawtooth + wobble
  const o1 = AC.createOscillator();
  const o2 = AC.createOscillator();
  const gain = AC.createGain();
  const lfo  = AC.createOscillator();
  const lfoG = AC.createGain();

  lfo.frequency.value = 8 + Math.random()*5;
  lfoG.gain.value = 30;
  lfo.connect(lfoG);
  lfoG.connect(o1.frequency);

  o1.type = 'sawtooth';
  o1.frequency.value = freq || (500 + Math.random()*200);
  o2.type = 'square';
  o2.frequency.value = (freq || 500) * 2;

  const mix = AC.createGain();
  mix.gain.value = 0.5;
  o2.connect(mix);
  o1.connect(gain);
  mix.connect(gain);
  gain.gain.value = 0;

  gain.connect(AC.destination);

  lfo.start(); o1.start(); o2.start();
  gain.gain.setTargetAtTime(0.06, AC.currentTime, 0.1);

  return {
    stop: () => {
      gain.gain.setTargetAtTime(0, AC.currentTime, 0.05);
      setTimeout(() => { try{o1.stop();o2.stop();lfo.stop();}catch(e){} }, 200);
    },
    freq: (f) => { o1.frequency.setTargetAtTime(f, AC.currentTime, 0.05); o2.frequency.setTargetAtTime(f*2, AC.currentTime, 0.05); }
  };
}

function playSplat() {
  for (let i = 0; i < 3; i++) {
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = 'sine';
    const f = 160 - i * 35;
    o.frequency.setValueAtTime(f, AC.currentTime + i*0.03);
    o.frequency.exponentialRampToValueAtTime(15, AC.currentTime + i*0.03 + 0.12);
    g.gain.setValueAtTime(0.4 - i*0.08, AC.currentTime + i*0.03);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + i*0.03 + 0.13);
    o.start(AC.currentTime + i*0.03);
    o.stop(AC.currentTime + i*0.03 + 0.14);
  }
  const buf = AC.createBuffer(1, AC.sampleRate * 0.07, AC.sampleRate);
  const data = buf.getChannelData(0);
  for (let i = 0; i < data.length; i++) data[i] = (Math.random()*2-1) * (1 - i/data.length);
  const src = AC.createBufferSource();
  src.buffer = buf;
  const ng = AC.createGain(); ng.gain.value = 0.35;
  src.connect(ng); ng.connect(AC.destination);
  src.start();
}

function playBite() {
  // Sting sound: sharp high ping descending
  const o = AC.createOscillator();
  const g = AC.createGain();
  o.connect(g); g.connect(AC.destination);
  o.type = 'sine';
  o.frequency.setValueAtTime(900, AC.currentTime);
  o.frequency.exponentialRampToValueAtTime(200, AC.currentTime + 0.35);
  g.gain.setValueAtTime(0.3, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.35);
  o.start(); o.stop(AC.currentTime + 0.35);
  // Add a quick low thud
  const o2 = AC.createOscillator();
  const g2 = AC.createGain();
  o2.connect(g2); g2.connect(AC.destination);
  o2.type = 'triangle';
  o2.frequency.setValueAtTime(120, AC.currentTime);
  o2.frequency.exponentialRampToValueAtTime(40, AC.currentTime + 0.2);
  g2.gain.setValueAtTime(0.4, AC.currentTime);
  g2.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + 0.2);
  o2.start(); o2.stop(AC.currentTime + 0.2);
}

function playGameOver() {
  [440,349,294,247].forEach((freq, i) => {
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.connect(g); g.connect(AC.destination);
    o.type = 'triangle';
    o.frequency.value = freq;
    g.gain.setValueAtTime(0.25, AC.currentTime + i*0.18);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + i*0.18 + 0.3);
    o.start(AC.currentTime + i*0.18);
    o.stop(AC.currentTime + i*0.18 + 0.3);
  });
}

// ── Boy Zone detection ──────────────────────────────────────
// Approximate bounding box of the sleeping boy (relative to viewport)
// Image composition: boy is roughly center-ish, slightly lower half
function getBoyRect() {
  const W = window.innerWidth, H = window.innerHeight;
  return {
    x: W * 0.28,
    y: H * 0.33,
    w: W * 0.44,
    h: H * 0.42
  };
}

function isOnBoy(mx, my) {
  const r = getBoyRect();
  return mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h;
}

// ── Game State ─────────────────────────────────────────────
let score = 0, lives = 3, timeLeft = 30;
let mosquitoes = [], gameRunning = false, timerInterval, spawnInterval;

const SPLAT_EMOJIS = ['💥','🩸','😵','💢','👊','✋'];
const BITE_TEXTS = [
  'খাইফেলাই রক্ত! 🩸',
  'আরেহহ বোকাচোদা! 😤',
  'খাইফেলাই রক্ত! 🩸',
  'আরেহহ বোকাচোদা! 😤',
  'কামড়াইলো রে! 😱',
  'আরেহহ বোকাচোদা! 😤',
];
const KILL_TEXTS = ['+1 মারছি! 💪', '+1 SPLAT! 💥', 'মরছে! 🦟💀', 'ধরা খাইছে! ✋'];

function startGame() {
  AC.resume();
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('end-screen').style.display = 'none';
  mosquitoes.forEach(m => { if(m.hum) m.hum.stop(); if(m.el) m.el.remove(); });
  mosquitoes = [];
  score = 0; lives = 3; timeLeft = 30;
  updateHUD();
  gameRunning = true;
  timerInterval = setInterval(tick, 1000);
  spawnInterval = setInterval(spawnMosquito, 1100);
  spawnMosquito(); spawnMosquito();
}

function tick() {
  timeLeft--;
  document.getElementById('timer-val').textContent = timeLeft;
  if (timeLeft <= 0) endGame();
}

function endGame() {
  gameRunning = false;
  clearInterval(timerInterval);
  clearInterval(spawnInterval);
  mosquitoes.forEach(m => { if(m.hum) m.hum.stop(); if(m.el) m.el.remove(); });
  mosquitoes = [];
  playGameOver();
  const msg = score >= 15 ? 'ছেলেটা নিরাপদে ঘুমাইলো! তুমি হিরো! 😴🎉'
            : score >= 7  ? 'কিছু মশা কামড় দিছে... তবু চেষ্টা ভালো! 😅'
            : 'মশারা রাতের ভোজ সাইরা ফেলছে 😬 আরেকবার চেষ্টা করো!';
  document.getElementById('end-msg').textContent = msg;
  document.getElementById('final-score').textContent = `Score: ${score} kills 🦟💀`;
  document.getElementById('end-screen').style.display = 'flex';
}

function updateHUD() {
  document.getElementById('score-val').textContent = score;
  document.getElementById('lives-display').textContent = '♥'.repeat(Math.max(0, lives));
  document.getElementById('timer-val').textContent = timeLeft;
}

function spawnMosquito() {
  if (!gameRunning) return;
  const el = document.createElement('div');
  el.className = 'mosquito';
  const size = 34 + Math.random() * 20;
  el.style.fontSize = size + 'px';
  el.textContent = '🦟';

  // Spawn near edges, then fly toward boy
  const side = Math.floor(Math.random() * 4);
  let x, y;
  if (side === 0) { x = Math.random() * window.innerWidth; y = -40; }
  else if (side === 1) { x = window.innerWidth + 10; y = Math.random() * window.innerHeight; }
  else if (side === 2) { x = Math.random() * window.innerWidth; y = window.innerHeight + 10; }
  else { x = -40; y = Math.random() * window.innerHeight; }

  el.style.left = x + 'px';
  el.style.top  = y + 'px';
  document.body.appendChild(el);

  // Target: somewhere around the boy
  const r = getBoyRect();
  const tx = r.x + r.w * (0.2 + Math.random() * 0.6);
  const ty = r.y + r.h * (0.2 + Math.random() * 0.6);

  const baseSpeed = 1.0 + Math.random() * 1.2;
  let vx = (tx - x) / 400 * baseSpeed;
  let vy = (ty - y) / 400 * baseSpeed;

  const hum = playMozzieHum(520 + Math.random() * 160);

  const id = Date.now() + Math.random();
  const mozzie = { id, el, x, y, vx, vy, alive: true, hum, size };
  mosquitoes.push(mozzie);

  el.addEventListener('click', e => {
    e.stopPropagation();
    killMosquito(mozzie, e.clientX, e.clientY);
  });
  el.addEventListener('touchstart', e => {
    e.preventDefault();
    const t = e.touches[0];
    killMosquito(mozzie, t.clientX, t.clientY);
  }, {passive: false});

  let lifetime = 0;
  mozzie.mover = setInterval(() => {
    if (!mozzie.alive || !gameRunning) { clearInterval(mozzie.mover); return; }
    lifetime++;
    // Wobble around target
    const wobble = Math.sin(lifetime * 0.18) * 1.2;
    const wobble2 = Math.cos(lifetime * 0.13) * 1.0;
    x += vx + wobble;
    y += vy + wobble2;

    // Gradually home toward boy center with some noise
    const cx = tx + Math.sin(lifetime * 0.07) * 40;
    const cy = ty + Math.cos(lifetime * 0.09) * 30;
    vx += (cx - x) * 0.0008;
    vy += (cy - y) * 0.0008;
    // Cap speed
    const spd = Math.sqrt(vx*vx + vy*vy);
    const maxSpd = 2.5;
    if (spd > maxSpd) { vx = vx/spd*maxSpd; vy = vy/spd*maxSpd; }

    el.style.left = x + 'px';
    el.style.top  = y + 'px';
    mozzie.x = x; mozzie.y = y;

    // Pitch hum based on speed
    mozzie.hum.freq(480 + spd * 60);

    // Check if mosquito reached boy zone
    if (isOnBoy(x, y)) {
      biteBoy(mozzie);
    }
  }, 25);
}

function biteBoy(mozzie) {
  if (!mozzie.alive || !gameRunning) return;
  mozzie.alive = false;
  clearInterval(mozzie.mover);
  if (mozzie.hum) mozzie.hum.stop();
  mozzie.el.remove();
  mosquitoes = mosquitoes.filter(m => m.id !== mozzie.id);

  lives--;
  updateHUD();
  playBite();

  // Red flash
  const flash = document.getElementById('bite-flash');
  flash.classList.add('flash');
  setTimeout(() => flash.classList.remove('flash'), 300);

  // Funny Bengali bite text
  const txt = BITE_TEXTS[Math.floor(Math.random() * BITE_TEXTS.length)];
  showBitePopup(txt);

  if (lives <= 0) endGame();
}

function killMosquito(mozzie, cx, cy) {
  if (!mozzie.alive || !gameRunning) return;
  mozzie.alive = false;
  clearInterval(mozzie.mover);
  clearTimeout(mozzie.escapeTimer);
  if (mozzie.hum) mozzie.hum.stop();
  mozzie.el.remove();
  mosquitoes = mosquitoes.filter(m => m.id !== mozzie.id);
  score++;
  updateHUD();
  playSplat();
  showSplat(cx, cy);
  showScorePopup(cx, cy);
}

function showSplat(x, y) {
  const el = document.createElement('div');
  el.className = 'splat';
  el.textContent = SPLAT_EMOJIS[Math.floor(Math.random()*SPLAT_EMOJIS.length)];
  el.style.left = (x - 20) + 'px';
  el.style.top  = (y - 20) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 700);
}

function showScorePopup(x, y) {
  const el = document.createElement('div');
  el.className = 'score-popup';
  el.textContent = KILL_TEXTS[Math.floor(Math.random()*KILL_TEXTS.length)];
  el.style.left = (x - 50) + 'px';
  el.style.top  = (y - 40) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 900);
}

function showBitePopup(txt) {
  const el = document.createElement('div');
  el.className = 'bite-popup';
  el.textContent = txt;
  el.style.left = (window.innerWidth/2 - 120) + 'px';
  el.style.top  = (window.innerHeight/2 - 60) + 'px';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1200);
}
</script>
